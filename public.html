<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Error | Mediska Malang</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0F172A;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .error-card {
      max-width: 500px;
      background: #1E293B;
      border: 1px solid #334155;
      border-top: 5px solid #EF4444;
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      color: #FCA5A5;
      margin-bottom: 10px;
      font-weight: 800;
    }
    p {
      font-size: 15px;
      color: #94A3B8;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .code {
      background: #0F172A;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      color: #F87171;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="icon">⚠️</div>
    <h1>SYSTEM ERROR</h1>
    <p>Terjadi gangguan pada sistem atau database klinik. Silakan hubungi tim IT untuk penanganan lebih lanjut.</p>
    <div class="code">KODE STATUS: ERR_CONNECTION_DATABASE_FAILED</div>
  </div>

  <!-- SKRIP AUTO-REFRESH OTOMATIS SAAT ADA COMMIT DI GITHUB -->
  <script>
    let currentVersion = null;

    setInterval(async () => {
      try {
        const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        const lastModified = response.headers.get('Last-Modified');

        if (!currentVersion) {
          currentVersion = lastModified;
        } else if (currentVersion !== lastModified) {
          console.log("Pembaruan terdeteksi di server. Memuat ulang...");
          location.reload();
        }
      } catch (error) {
        // Abaikan gangguan jaringan sesaat
      }
    }, 10000); // Mengecek setiap 10 detik
  </script>

</body>
</html>
